A1:
  statement: The computational domain is an affine axis-aligned hexahedral box.
  status: active_for_current_solver
  implication: Current Q1 Bernstein/vertex positivity is a whole-cell guarantee.
  revision_rule: A challenger may use another mesh if its positivity, export, and comparison implications are documented.

A2:
  statement: The numerical boundary condition is zero total probability flux.
  status: current_physical_target
  formula: (f p - D grad(p)) . n = 0

A3:
  statement: The default noise matrix is full rank with B equal to the identity.
  status: default_only
  implication: D is one-half the identity and the PDE is uniformly parabolic.
  production_scope: The selected production method must ultimately support a constant general 3 by 3 B and therefore full SPD D with mixed derivatives.
  branch_rule: Directional diagonal-only methods may be studied as special-case challengers but cannot certify the general production role.

A4:
  statement: A rank-deficient noise matrix still gives uniform ellipticity.
  status: false_in_general

A5:
  statement: Backward Euler with theta equal to one is the validated time baseline.
  status: validated_baseline_not_mandate

A6:
  statement: Quadrature degree 14 is adequate for adopted projections.
  status: numerically_established_for_tested_cases
  evidence: method_selection_report.json

A7:
  statement: Fixed-subcell non-negative Bernstein coefficients are necessary for Q2 positivity.
  status: false_in_general

A8:
  statement: The current Q1 configuration is certified for large dataset generation.
  status: false
  evidence: method_selection_report.json

A9:
  statement: Exact-native-law Monte Carlo moments are an independent short-time reference.
  status: active
  limitation: Finite samples do not define a stable full three-dimensional density target.

A10:
  statement: The present method ranking is permanent.
  status: false
  revision_rule: Re-rank candidates when controlled evidence, applicability, cost, or the production scope changes.

A11:
  statement: A numerical method must be implemented in DOLFINx to be considered.
  status: false
  limitation: Challengers must still solve the intended equation or clearly state and justify any surrogate.
