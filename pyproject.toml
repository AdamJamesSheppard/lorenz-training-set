[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["sample_dataset", "runs", "results"]

[tool.ruff.lint]
# The inherited research code is not style-normalized yet. These checks catch
# defects without creating a repository-wide formatting-only diff.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "^(sample_dataset|runs|results)/"

