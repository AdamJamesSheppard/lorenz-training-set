name: Operator governance (fast, no FEM or scientific training)
on: [push, pull_request]
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.2.6' 'pytest==8.3.5' 'scipy==1.15.3'
      - run: python scripts/check_operator_learning.py
      - run: python -m pytest -q tests/operator_learning
