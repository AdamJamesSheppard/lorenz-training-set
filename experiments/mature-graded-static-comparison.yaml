research_gates:
  - Every graded cell is an affine axis-aligned hexahedron and every edge aligns exactly to the frozen 180x216x216 comparison grid.
  - The fine bands retain uniform-60 physical spacing over the probability-bearing lobe support; only low-probability exterior slabs merge pairs of uniform cells.
  - The common-grid density L1 difference from uniform-60 must be below half the prior 45-to-60 difference, 0.20997137.
  - Mean dynamic local-QP correction must be below the branch-specific 0.0008 efficiency target; this does not retroactively replace the original 0.001 mature-state criterion.
  - Covariance, marginal TV, joint TV and lobe probabilities may not degrade from uniform-60 by more than 0.005.
  - The graded branch must use at most half the uniform-60 DG DOFs, 75 percent of its runtime and 75 percent of its peak per-rank memory.
  - Whole-cell positivity, zero measured negative mass, mass conservation and zero optimizer failures or fallbacks remain mandatory.
decision_rule: Passing supports localized under-resolution and validates static grading as an efficiency mechanism; dataset generation remains unauthorized pending density convergence resolution and domain sensitivity.
notes:
  - Uniform-60 already passes the original mature mean-correction gate of 0.001 and all low-dimensional statistical and positivity gates.
  - Mature statistical and positivity readiness is therefore separated from the still-open full-density convergence and efficiency question.
  - The graded branch contains 105248 cells and 2841696 discontinuous Q2 degrees of freedom, 33.84 percent of uniform-60.
