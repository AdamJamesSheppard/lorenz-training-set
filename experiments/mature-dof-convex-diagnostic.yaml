research_design:
  - Evaluate the frozen mature analytic law before propagation and one raw Q2-CN step from the common incumbent-positive initial state.
  - Compare both limiters against exactly the same raw Q2 polynomial in each case.
  - The prototype projects whole-cell Q2 Bernstein DOFs onto a mass-conserving nonnegative simplex; this is a convex DOF diagnostic, not a claimed implementation of the published hyperbolic subcell-flux algorithm.
  - Include the certified finest mesh and one targeted uniformly finer mesh to test whether raw negativity and correction fall rapidly with resolution.
decision_rule: Pursue a full in-loop subcell convex-limited operator only if the prototype needs less than half the incumbent QP L1 correction while preserving mass, positivity, covariance, marginals, and lobe probabilities.
decision_scope: Diagnostic only. MATURE_STATE remains open and dataset generation remains unauthorized regardless of outcome.
