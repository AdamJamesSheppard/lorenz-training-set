id: local-q2-cn-full-spd-spatial-refinement
kind: full_spd_q2_study
status: predeclared_conditional_diagnostic
study:
  cells: [20, 24, 24]
  comparison_refinement_ratio: 1.5
  dt: 0.00015625
  final_time: 0.05
  seed: 20260910
  monte_carlo_paths: 1000000
  mc_dt: 0.000125
  bootstrap_replicates: 1000
  bootstrap_seed: 20261910
  certificate_max_depth: 4
  ksp_rtol: 1.0e-12
  ksp_atol: 1.0e-15
  initialization: gaussian_projected
  initial_mean: [1.0, 1.0, 20.0]
  initial_standard_deviation: [2.0, 2.0, 3.0]
  initial_quadrature_degree: 14
  common_comparison_grid: [180, 216, 216]
  noise_matrix:
    - 1.4142135623730951
    - 0.0
    - 0.0
    - 0.5656854249492381
    - 1.2961481396815722
    - 0.0
    - 0.28284271247461906
    - 0.3394673699166024
    - 1.3434142714594956
  branches:
    - name: q2_local_qp_cn_full_spd_20x24x24
      cells: [20, 24, 24]
      export_subcells: 9
      degree: 2
      theta: 0.5
      positivity_method: local_qp
      optimizer_backend: osqp
      optimizer_ftol: 1.0e-10
      maximum_iterations: 10000
      archive_raw: false
    - name: q2_local_qp_cn_full_spd_30x36x36
      cells: [30, 36, 36]
      export_subcells: 6
      degree: 2
      theta: 0.5
      positivity_method: local_qp
      optimizer_backend: osqp
      optimizer_ftol: 1.0e-10
      maximum_iterations: 10000
      archive_raw: false
    - name: q2_local_qp_cn_full_spd_45x54x54
      cells: [45, 54, 54]
      export_subcells: 4
      degree: 2
      theta: 0.5
      positivity_method: local_qp
      optimizer_backend: osqp
      optimizer_ftol: 1.0e-10
      maximum_iterations: 10000
      archive_raw: false
  pairwise_comparisons:
    - name: full_spd_local_qp_cn_20_to_30
      baseline: q2_local_qp_cn_full_spd_20x24x24
      challenger: q2_local_qp_cn_full_spd_30x36x36
    - name: full_spd_local_qp_cn_30_to_45
      baseline: q2_local_qp_cn_full_spd_30x36x36
      challenger: q2_local_qp_cn_full_spd_45x54x54
execution:
  mpi_ranks: 8
  numerical_threads: 1
scientific_decision:
  maximum_step_mass_change: 1.0e-12
  maximum_absolute_mass_error: 1.0e-10
  maximum_negative_mass: 1.0e-13
  maximum_normalized_covariance_error: 0.04
  maximum_mean_relative_l1_correction: 0.001
  maximum_relative_l1_correction: 0.005
  maximum_off_diagonal_covariance_error: 0.25
  maximum_off_diagonal_correlation_error: 0.08
  require_positive_observed_order: true
research_gates:
  - Execute only after the 30x36x36 full-SPD controlled experiment passes its stricter gates.
  - Exact DG averages from all meshes are exported conservatively on the common 180x216x216 grid.
  - The 30-to-45 L1 difference is smaller than the 20-to-30 L1 difference and spatial order is positive.
  - Every completed step is whole-cell Bernstein-certified with zero measured negative mass.
  - Projection preserves incoming mass to 1e-12 and final absolute mass error is at most 1e-10.
  - No optimizer failure or scalar fallback is accepted.
  - Every mesh stays within the stated covariance, off-diagonal, correlation and correction limits.
  - Passing advances to mature-state certification; dataset generation remains unauthorized.
notes:
  - The hierarchy thresholds accommodate the known coarse-mesh identity-noise error while retaining fixed limits.
  - Deterministic common-grid L1 differences are the primary convergence evidence.
  - The observed spatial rate is numerical evidence and is not a formal-order theorem.

