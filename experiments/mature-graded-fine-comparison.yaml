research_gates:
  - The fine lobe bands use common-grid span two, compared with span three for uniform-60 and the first graded mesh; exterior slabs retain the validated span-six cells.
  - D_60,gf and D_g,gf are computed conservatively on the frozen 180x216x216 grid.
  - Each new density difference must be below half the prior D_45,60 value of 0.20997137; D_60,gf below 0.001688331 is additionally recorded as a strong reference-stability diagnostic rather than a mandatory gate.
  - Mean dynamic local-QP correction must fall below the previously declared 0.0008 target.
  - Covariance, matched-grid marginal TV, joint TV and lobe probability may not degrade by more than 0.005 from either comparator.
  - The fine graded branch must retain an efficiency advantage: at most 75 percent of uniform-60 DG unknowns and 90 percent of its runtime and peak per-rank memory.
  - Whole-cell positivity, zero measured negative mass, mass conservation and zero optimizer failures or fallbacks remain mandatory.
decision_rule: A complete pass supports mature-density convergence under targeted refinement. The strong D_60,gf stability diagnostic determines whether one further graded level is needed before aligned-box domain sensitivity.
notes:
  - Static grading is already validated for efficiency by the 44x52x46 result despite its formal 0.0008 correction-gate failure.
  - This branch has 220864 cells and 5963328 discontinuous Q2 degrees of freedom, 71.01 percent of uniform-60.
  - Dataset generation remains unauthorized regardless of this run; domain-size sensitivity is still required.
