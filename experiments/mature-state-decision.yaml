id: local-q2-cn-full-spd-mature-bimodal
kind: mature_full_spd_q2_study
status: predeclared_executable_next_gate
purpose: Test the full-SPD-certified local-QP Q2 Crank--Nicolson candidate on one independently constructed, z-conditioned bimodal Lorenz law.
study:
  cells: [20, 24, 24]
  comparison_refinement_ratio: 1.5
  dt: 0.00015625
  final_time: 0.05
  seed: 20260920
  monte_carlo_paths: 1000000
  mc_dt: 0.000125
  bootstrap_replicates: 1000
  bootstrap_seed: 20261920
  certificate_max_depth: 4
  ksp_rtol: 1.0e-12
  ksp_atol: 1.0e-15
  initialization: mixture_projected
  initial_quadrature_degree: 14
  common_comparison_grid: [180, 216, 216]
  density_metric_grid: [20, 24, 24]
  density_smoothing_sigma: 0.75
  spinup_particles: 200000
  spinup_time: 2.0
  spinup_dt: 0.001
  components_per_lobe: 8
  observation_z: 25.0
  observation_variance: 16.0
  noise_matrix:
    - 1.4142135623730951
    - 0.0
    - 0.0
    - 0.5656854249492381
    - 1.2961481396815722
    - 0.0
    - 0.28284271247461906
    - 0.3394673699166024
    - 1.3434142714594956
  branches:
    - name: mature_bimodal_q2_local_qp_20x24x24
      cells: [20, 24, 24]
      export_subcells: 9
      degree: 2
      theta: 0.5
      positivity_method: local_qp
      optimizer_backend: osqp
      optimizer_ftol: 1.0e-10
      maximum_iterations: 10000
      archive_raw: false
    - name: mature_bimodal_q2_local_qp_30x36x36
      cells: [30, 36, 36]
      export_subcells: 6
      degree: 2
      theta: 0.5
      positivity_method: local_qp
      optimizer_backend: osqp
      optimizer_ftol: 1.0e-10
      maximum_iterations: 10000
      archive_raw: false
    - name: mature_bimodal_q2_local_qp_45x54x54
      cells: [45, 54, 54]
      export_subcells: 4
      degree: 2
      theta: 0.5
      positivity_method: local_qp
      optimizer_backend: osqp
      optimizer_ftol: 1.0e-10
      maximum_iterations: 10000
      archive_raw: false
  pairwise_comparisons:
    - name: mature_bimodal_20_to_30
      baseline: mature_bimodal_q2_local_qp_20x24x24
      challenger: mature_bimodal_q2_local_qp_30x36x36
    - name: mature_bimodal_30_to_45
      baseline: mature_bimodal_q2_local_qp_30x36x36
      challenger: mature_bimodal_q2_local_qp_45x54x54
execution:
  mpi_ranks: 8
  numerical_threads: 1
scientific_decision:
  maximum_step_mass_change: 1.0e-12
  maximum_absolute_mass_error: 1.0e-10
  maximum_negative_mass: 1.0e-13
  maximum_normalized_covariance_error: 0.08
  maximum_covariance_error_to_mc_p95_ratio: 5.0
  maximum_mean_relative_l1_correction: 0.001
  maximum_relative_l1_correction: 0.005
  maximum_off_diagonal_correlation_error: 0.08
  maximum_marginal_tv: 0.05
  maximum_lobe_probability_error: 0.025
  maximum_smoothed_joint_tv: 0.15
  maximum_initial_projection_joint_tv: 0.10
  require_positive_observed_order: true
  require_decreasing_correction: true
research_gates:
  - The initial law is fitted from an independent full-SPD stochastic ensemble after spin-up, symmetrized across Lorenz lobes, then conditioned analytically using a z-only likelihood.
  - The frozen analytic Gaussian mixture is projected independently onto every Q2 mesh; its hash and pre-forecast projection discrepancies are recorded.
  - Exact DG averages from all meshes are exported conservatively on the common 180x216x216 grid.
  - The 30-to-45 L1 difference must be smaller than the 20-to-30 difference and the observed spatial rate must be positive.
  - Mean QP correction must decrease strictly across the three meshes.
  - Every completed step must be whole-cell Bernstein-certified with zero measured negative mass.
  - Projection must preserve incoming mass to 1e-12 and final absolute mass error must be at most 1e-10.
  - No optimizer failure or scalar fallback is accepted.
  - Covariance, marginal, lobe-probability and smoothed joint-density errors must stay within the frozen limits.
decision_rule: A complete pass advances the frozen candidate to aligned-box domain-truncation sensitivity; dataset generation remains unauthorized.
revision_policy: Revise gates only with documented rationale before inspecting outcomes; never relax a criterion to rescue a completed run.
notes:
  - The first mature gate deliberately uses the discriminating ambiguous bimodal posterior. A single-lobe posterior is a later confirmation case.
  - The smoothed joint-density comparison uses one fixed coarse 3-D grid for every mesh; deterministic common-grid mesh differences remain the primary convergence evidence.
  - The observed spatial rate is numerical evidence and is not a formal-order theorem.
