id: smoke-forecast-q1
kind: forecast
description: Cheap deterministic end-to-end forecast used to verify the run harness.
solver:
  cells: [3, 4, 4]
  degree: 1
  dt: 0.01
  theta: 1.0
  final_time: 0.02
  initialization: projected
  quadrature_degree: 14
initial_density:
  mean: [1.0, 1.0, 20.0]
  standard_deviation: [3.0, 3.0, 5.0]
execution:
  mpi_ranks: 1

