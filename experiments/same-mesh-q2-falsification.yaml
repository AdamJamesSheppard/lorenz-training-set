id: same-mesh-q2-falsification
kind: same_mesh_q2_study
status: predeclared
study:
  cells: [30, 36, 36]
  dt: 0.000625
  final_time: 0.05
  seed: 20260910
  monte_carlo_paths: 200000
  mc_dt: 0.000125
  bootstrap_replicates: 200
  certificate_max_depth: 4
  initial_law: positive_limited_q1_polynomial_embedded_exactly_in_q2
  branches:
    - name: q1_baseline
      degree: 1
      certificate_mode: fixed
    - name: q2_fixed_subcell
      degree: 2
      certificate_mode: fixed
    - name: q2_certificate_gated
      degree: 2
      certificate_mode: adaptive
execution:
  mpi_ranks: 8
decision_gates:
  corrected_covariance_error_maximum: 0.03
  corrected_covariance_mc_p95_ratio_maximum: 5.0
  limiter_relative_l1_mean_maximum: 0.001
  limiter_relative_l1_step_maximum: 0.005
  mass_error_maximum: 1.0e-10
  negative_mass_maximum: 1.0e-13
  timestep_halving_covariance_change_maximum: 0.003
  timestep_halving_l1_change_maximum: 0.0025
notes:
  - Raw Q2 coefficients before every correction are retained under the immutable run.
  - The timestep-halving branch is added only if the corrected same-step branch survives its earlier gates.
  - Equal physical mesh is the degree comparison; cost and memory are recorded separately.
