decision_rules:
  - The pure local branch must report every negative-average cell as infeasible; it must not conceal them by changing cell mass.
  - Any accepted QP solution must preserve its cell average and satisfy every fixed control-subcell Bernstein inequality within 5e-11.
  - The QP mass-matrix objective must not exceed the matched scalar-scaling objective beyond numerical tolerance.
  - This terminal-state isolation study does not authorize an in-loop positivity mechanism or dataset generation.
  - If negative cell averages or repeated projection remain material, proceed to a positive low-order local flux or AFC comparator.
notes:
  - Adaptive subdivision is used only to skip raw cells already certified non-negative.
  - Every solved QP uses one fixed convex inequality matrix from the 2x2x2 Q2 control subcells.
  - The global-average-repair-plus-local-QP branch isolates replacement of Stage-2 scaling while retaining the incumbent Stage-1 comparator.
